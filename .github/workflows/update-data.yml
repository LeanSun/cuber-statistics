name: Update WCA data

on:
  schedule:
    # 每周一 06:17 UTC（WCA 通常在每个比赛周末后更新导出）
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      detail_max:
        description: 'Players with full record/podium detail'
        required: false
        default: '2500'
      slim_max:
        description: 'Players emitted into js/data.js (the rest go to the lazy roster file)'
        required: false
        default: '60000'
  # 数据管道代码变更时自动重建（不含 js/data.js 本身，避免机器人提交触发循环）
  push:
    branches: [main]
    paths:
      - 'etl/**'
      - 'js/calc.js'
      - 'js/country-table.js'
      - 'js/params.js'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: wca-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch WCA export metadata & download TSV zip
        run: |
          curl -fsSL "https://www.worldcubeassociation.org/api/v0/export/public" -o /tmp/wca_api.json
          TSV_URL=$(python3 -c "import json,sys; print(json.load(open('/tmp/wca_api.json'))['tsv_url'])")
          echo "TSV_URL=$TSV_URL" >> "$GITHUB_ENV"
          VER=$(python3 -c "import json; print(json.load(open('/tmp/wca_api.json')).get('export_version','v2.0.2'))")
          echo "EXPORT_VER=$VER" >> "$GITHUB_ENV"
          DATE=$(python3 -c "import json; print(json.load(open('/tmp/wca_api.json')).get('export_date','')[:10])")
          echo "EXPORT_DATE=$DATE" >> "$GITHUB_ENV"
          echo "Downloading $TSV_URL"
          curl -fsSL "$TSV_URL" -o /tmp/wca_export.tsv.zip
          ls -lh /tmp/wca_export.tsv.zip

      - name: Run ETL (WCA export -> js/data.js)
        env:
          # 全量导出（30 万选手 / 700 万成绩）计算峰值超过 Node 默认 4GB 堆
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node etl/build.js \
            --zip /tmp/wca_export.tsv.zip \
            --out js/data.js \
            --detail-max "${{ github.event.inputs.detail_max || '2500' }}" \
            --slim-max "${{ github.event.inputs.slim_max || '60000' }}" \
            --date "${EXPORT_DATE:-$(date +%F)}" \
            --ver "${EXPORT_VER:-v2.0.2}"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js js/roster.js
          if git diff --cached --quiet; then
            echo "No changes to js/data.js"
          else
            git commit -m "chore: update WCA data (${EXPORT_DATE:-$(date +%F)})"
            git push
          fi
