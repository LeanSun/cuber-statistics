name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  etl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check all JS
        run: |
          for f in js/*.js etl/*.js; do node --check "$f" || exit 1; done
      - name: Regenerate sample fixtures
        run: python3 etl/make_sample.py
      - name: Run ETL against sample & verify output shape
        run: |
          node etl/build.js --dir etl/sample --out ./_sample_data.js --date 2026-10-18 --ver v2.0.2 --detail-max 20 --slim-max 20
          node -e '
            const fs=require("fs"); const Calc=require("./js/calc.js");
            global.window={Calc:Calc,U:Calc.U}; global.Calc=Calc; global.U=Calc.U;
            eval(fs.readFileSync("./_sample_data.js","utf8"));
            const M=global.window.MOCK;
            function bad(m){ console.error(m); process.exit(1); }
            const mp=M.ranked.find(x=>x.name==="Max Park");
            const mbf=(mp.records.find(r=>r.ev==="333mbf")||{}).value;
            if(mbf!=="40/40 58:33"){ console.error("mbf decode wrong: "+mbf); process.exit(1); }
            const th=M.ranked.find(x=>x.name==="Tim Habermaas");
            if(!th||!th.records||!th.records.length) bad("Tim Habermaas missing or slim profile: "+JSON.stringify(th&&{slim:th.slim}));
            const mbo=(th.records.find(r=>r.ev==="333mbo")||{}).value;
            if(mbo!=="6/6 47:58"){ console.error("mbo (old multi-blind) decode wrong: "+mbo); process.exit(1); }
            if(!M.eventBoards||!M.eventBoards["333"]||!M.eventBoards["333"].length) { console.error("event boards missing"); process.exit(1); }
            const b333=M.eventBoards["333"][0];
            if(!b333||b333.id!=="2013PARK01"||b333.r!==1||b333.s!=="3.60"){ console.error("333 board top wrong (应取 ranks_single 单次名次1/3.60): "+JSON.stringify(b333)); process.exit(1); }
            const b333b=M.eventBoards["333"][1];
            if(!b333b||b333b.id!=="2008FELI01"||b333b.r!==2||b333b.af!=="4.00"){ console.error("333 board #2 wrong: "+JSON.stringify(b333b)); process.exit(1); }
            const mboB=(M.eventBoards["333mbo"]||[])[0];
            if(!mboB||mboB.s!=="6/6 47:58"){ console.error("mbo board top wrong: "+JSON.stringify(mboB)); process.exit(1); }
            console.log("ETL smoke OK:",M.ranked.length,"players, mbf:",mbf,", mbo:",mbo,", boards:",Object.keys(M.eventBoards).length);

            /* 国家维度：ISO2 归一化 + 中文名 + 洲际映射（此前全为 null，导致地区筛选失效） */
            const iso=M.ranked[0].country;
            if(!/^[A-Z]{2}$/.test(iso)) bad("country not normalized to ISO2: "+iso);
            if(!M.countriesZh||!M.countriesZh[iso]) bad("missing zh country name for "+iso);
            if(!M.continentOf||!M.continentOf[iso]) bad("missing continent mapping for "+iso);
            /* 洲际必须覆盖所有选手：此前 US/NL/GB/KR 等洲际码为空，大洲筛选会漏人 */
            const noCont=M.ranked.filter(p=>!M.continentOf[p.country]);
            if(noCont.length) bad("players without continent ("+noCont.length+"): "+noCont.slice(0,5).map(p=>p.name+"/"+p.country).join(", "));
            /* 真实统计：参赛行数 / 尝试 / 成功 / 城市 / 单场最多项目数 */
            const st=M.stats(M.ranked[0]);
            if(!(st.resultRows>0)) bad("resultRows not real: "+st.resultRows);
            if(!(st.attempts>0&&st.solves>0)) bad("attempts/solves not real: "+st.attempts+"/"+st.solves);
            if(!(st.cities>0)) bad("cities not real: "+st.cities);
            if(!(st.maxEventsPerComp>0)) bad("maxEventsPerComp not real: "+st.maxEventsPerComp);
            /* 纪录保持天数：此前恒为 0 */
            if(!(st.heldLongest>0)) bad("held days still zero: "+st.heldLongest);
            /* 分组：正阶组=2~7 阶、无最少步组 */
            const sp=M.presetGroups.find(g=>g.id==="speed");
            if(!sp||sp.ids.join(",")!=="222,333,444,555,666,777") bad("speed group wrong: "+JSON.stringify(sp));
            if(M.presetGroups.some(g=>g.id==="fmc")) bad("fmc group should be removed");
            /* M4统治力 / M7 实战对战：worldRank 的值是对象 {r,b,a}，必须取 .r。
               早期版本把对象当名次传入 domScore()，NaN 传播导致这两个模块全员归零。 */
            const zeroM4=M.ranked.filter(p=>!(p.m.m4>0));
            const zeroM7=M.ranked.filter(p=>!(p.m.m7>0));
            if(zeroM4.length) bad("m4 all-zero for "+zeroM4.length+" players (worldRank .r bug?)");
            if(zeroM7.length) bad("m7 all-zero for "+zeroM7.length+" players (worldRank .r bug?)");
            const elo=M.ranked.map(p=>p.eloPeak);
            if(Math.min.apply(null,elo)<1400||Math.max.apply(null,elo)>2300) bad("eloPeak out of 1400-2300 range: "+Math.min.apply(null,elo)+"~"+Math.max.apply(null,elo));
            /* 年度前10 / 前100：此前因 ETL 未产出 yearRank 而恒为 0 */
            if(!M.ranked.some(p=>p.yTop10>0)) bad("yTop10 all zero (annual ranking missing)");
            if(!M.ranked.some(p=>p.yTop100>0)) bad("yTop100 all zero (annual ranking missing)");
            /* 归一化分母与逐项计算过程：选手页要靠它们写出每个模块的代入过程 */
            if(!M.meta||!M.meta.modMax) bad("meta.modMax missing (module normalization denominators)");
            ["m1","m2","m3","m4","m5","m6","m7"].forEach(k=>{ if(!(M.meta.modMax[k]>0)) bad("modMax."+k+" not positive: "+M.meta.modMax[k]); });
            const mc=M.ranked[0].mCalc;
            if(!mc) bad("mCalc missing on detail-tier player");
            else {
              if(!Array.isArray(mc.rec)||mc.rec.length!==6) bad("mCalc.rec wrong: "+JSON.stringify(mc.rec));
              if(!Array.isArray(mc.pod)||mc.pod.length!==12) bad("mCalc.pod wrong");
              if(!Array.isArray(mc.rk)||!mc.rk.length||mc.rk[0].length!==6) bad("mCalc.rk wrong: "+JSON.stringify(mc.rk).slice(0,120));
              /* 前端代入 M5 的结果必须与 ETL 归一化后的 m5 一致（否则页面上的推导过程对不上号） */
              const rawM5=(mc.ev/21)*0.7+Math.min(mc.ev/17,1)*0.3;
              const nM5=Math.min(100,rawM5/M.meta.modMax.m5*100);
              if(Math.abs(nM5-M.ranked[0].m.m5)>0.05) bad("M5 front-end recompute mismatch: "+nM5.toFixed(3)+" vs "+M.ranked[0].m.m5);
            }
            console.log("extra assertions OK: iso="+iso+" zh="+M.countriesZh[iso]+" cont="+M.continentOf[iso]+" held="+st.heldLongest+" elo="+Math.min.apply(null,elo)+"~"+Math.max.apply(null,elo)+" yTop10max="+Math.max.apply(null,M.ranked.map(p=>p.yTop10)));
          '
      - name: Page render smoke (DOM stubs)
        run: |
          SMOKE_DATA=./_sample_data.js node etl/smoke_pages.js
