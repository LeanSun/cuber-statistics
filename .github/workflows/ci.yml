name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  etl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check all JS
        run: |
          for f in js/*.js etl/*.js; do node --check "$f" || exit 1; done
      - name: Run ETL against real sample & verify output shape
        # etl/sample/*.tsv 是从真实 WCA 导出抽取的真实选手真实成绩（见 etl/make_sample.py），
        # 已随仓库提交；CI 环境无导出包，不再在流水线里重跑 make_sample.py。
        run: |
          node etl/build.js --dir etl/sample --out ./_sample_data.js --date 2026-10-18 --ver v2.0.2 --detail-max 20 --slim-max 20 --no-roster
          node -e '
            const fs=require("fs"); const Calc=require("./js/calc.js");
            global.window={Calc:Calc,U:Calc.U}; global.Calc=Calc; global.U=Calc.U;
            eval(fs.readFileSync("./_sample_data.js","utf8"));
            const M=global.window.MOCK;
            function bad(m){ console.error(m); process.exit(1); }
            /* 多盲解码：只要有 333mbf / 333mbo 纪录，解码结果必须符合 N/N MM:SS
               （此前写死 Max Park=40/40 58:33、Tim Habermaas=6/6 47:58 等合成取值，
               真实数据下必然失败；改为对任意真实纪录做格式校验） */
            const MBF_RE=/^\d+\/\d+ \d+:\d{2}(:\d{2})?$/;
            const mbfP=M.ranked.filter(p=>(p.records||[]).some(r=>r.ev==="333mbf"));
            const mboP=M.ranked.filter(p=>(p.records||[]).some(r=>r.ev==="333mbo"));
            mbfP.forEach(p=>{ const v=(p.records.find(r=>r.ev==="333mbf")||{}).value; if(!MBF_RE.test(v||"")) bad(p.name+" 333mbf 解码格式错误: "+v); });
            mboP.forEach(p=>{ const v=(p.records.find(r=>r.ev==="333mbo")||{}).value; if(!MBF_RE.test(v||"")) bad(p.name+" 333mbo 解码格式错误: "+v); });
            console.log("mbf players:",mbfP.length,"| mbo players:",mboP.length);
            if(!M.eventBoards||!M.eventBoards["333"]||!M.eventBoards["333"].length) bad("event boards missing");
            const b333=M.eventBoards["333"];
            /* 榜按成绩时间升序（s 越小越好）。样本仅含 8 名真实选手，全球 WR 持有者未必在其中，
               故不再要求榜首 r===1；只校验：排序正确 + 字段合法。 */
            let bSorted=true;
            for(let i=1;i<b333.length;i++){ if(parseFloat(b333[i-1].s) > parseFloat(b333[i].s)+1e-9){ bSorted=false; break; } }
            if(!bSorted) bad("333 单次榜未按成绩升序排列（s 越小越好）");
            const b3330=b333[0];
            if(!b3330||!(b3330.r>0)) bad("333 单次榜首缺少合法 world_rank: "+(b3330&&b3330.r));
            if(!/^\d+(\.\d+)?$/.test(b3330.s||"")) bad("333 单次榜首缺少合法成绩: "+(b3330&&b3330.s));
            if(b333[1] && parseFloat(b333[1].s) < parseFloat(b3330.s)-1e-9) bad("333 单次榜 #2 不应快于榜首");
            if(M.eventBoards["333mbo"]&&M.eventBoards["333mbo"].length){
              const mb=M.eventBoards["333mbo"][0];
              if(!MBF_RE.test(mb.s||"")) bad("333mbo 榜首解码格式错误: "+mb.s);
            }
            console.log("ETL smoke OK:",M.ranked.length,"players, mbf:",mbfP.length?",":"(none)",", mbo:",mboP.length?",":"(none)",", boards:",Object.keys(M.eventBoards).length);

            /* 国家维度：ISO2 归一化 + 中文名 + 洲际映射（此前全为 null，导致地区筛选失效） */
            const iso=M.ranked[0].country;
            if(!/^[A-Z]{2}$/.test(iso)) bad("country not normalized to ISO2: "+iso);
            if(!M.countriesZh||!M.countriesZh[iso]) bad("missing zh country name for "+iso);
            if(!M.continentOf||!M.continentOf[iso]) bad("missing continent mapping for "+iso);
            /* 洲际必须覆盖所有选手：此前 US/NL/GB/KR 等洲际码为空，大洲筛选会漏人 */
            const noCont=M.ranked.filter(p=>!M.continentOf[p.country]);
            if(noCont.length) bad("players without continent ("+noCont.length+"): "+noCont.slice(0,5).map(p=>p.name+"/"+p.country).join(", "));
            /* 真实统计：参赛行数 / 尝试 / 成功 / 城市 / 单场最多项目数 */
            const st=M.stats(M.ranked[0]);
            if(!(st.resultRows>0)) bad("resultRows not real: "+st.resultRows);
            if(!(st.attempts>0&&st.solves>0)) bad("attempts/solves not real: "+st.attempts+"/"+st.solves);
            if(!(st.cities>0)) bad("cities not real: "+st.cities);
            if(!(st.maxEventsPerComp>0)) bad("maxEventsPerComp not real: "+st.maxEventsPerComp);
            /* 纪录保持天数：此前恒为 0 */
            if(!(st.heldLongest>0)) bad("held days still zero: "+st.heldLongest);
            /* 分组：正阶组=2~7 阶、无最少步组 */
            const sp=M.presetGroups.find(g=>g.id==="speed");
            if(!sp||sp.ids.join(",")!=="222,333,444,555,666,777") bad("speed group wrong: "+JSON.stringify(sp));
            if(M.presetGroups.some(g=>g.id==="fmc")) bad("fmc group should be removed");
            /* 六维模型：维度分与权重由 ETL 直接下发（p.six / meta.sixWeights），
               旧七模块（含 M7 对战强度）已整体停用，不再有任何断言依赖它们。 */
            const det=M.ranked.filter(p=>!p.slim);
            if(!det.length) bad("no detail-tier players");
            if(!M.meta.sixWeights) bad("meta.sixWeights missing (six-dimension weights)");
            if(!M.meta.sixNames||Object.keys(M.meta.sixNames).length!==6) bad("meta.sixNames should have 6 dimensions");
            ["m1","m2","m3","m4","m5","m6"].forEach(k=>{ if(!(M.meta.sixWeights[k]>0)) bad("sixWeights."+k+" not positive"); });
            /* 有六维分的选手：t 必须等于 Σ w_d · s_d */
            const sixP=M.ranked.filter(p=>p.six);
            sixP.forEach(p=>{
              let x=0; ["m1","m2","m3","m4","m5","m6"].forEach(k=>{ x+=(M.meta.sixWeights[k]||0)*(p.six[k]||0); });
              if(Math.abs(x-p.six.t)>0.05) bad("six total mismatch for "+p.name+": "+x.toFixed(3)+" vs "+p.six.t);
            });
            /* 没有六维分的选手一律记 0，且 overall 不得回退旧 esum */
            const zeroOv=M.ranked.filter(p=>!p.six && p.overall>0);
            if(zeroOv.length) bad("players without six must score 0, got "+zeroOv.length+" non-zero (esum fallback?)");
            console.log("six-dimension OK:", sixP.length, "players with six scores");
            /* 年度前10 / 前100：此前因 ETL 未产出 yearRank 而恒为 0 */
            if(!M.ranked.some(p=>p.yTop10>0)) bad("yTop10 all zero (annual ranking missing)");
            if(!M.ranked.some(p=>p.yTop100>0)) bad("yTop100 all zero (annual ranking missing)");
            /* 六维交付表必须随仓库入库：否则 Actions 每周重建 js/data.js 会丢失六维分 */
            const fsx=require("fs");
            if(!fsx.existsSync("etl/score/sixdim_site.tsv")) bad("etl/score/sixdim_site.tsv missing (six-dimension delivery table)");
            for(const t of ["","_single","_avg"]) if(!fsx.existsSync("etl/score/sixdim_site"+t+".tsv")) bad("etl/score/sixdim_site"+t+".tsv missing (track-specific six-dimension table)");
            /* 按项目分解表体积太大，仓库存 gzip 归档（build.js 两种都能读） */
            for(const t of ["","_single","_avg"]) if(!fsx.existsSync("etl/score/sixdim_by_event"+t+".tsv") && !fsx.existsSync("etl/score/sixdim_by_event"+t+".tsv.gz")) bad("etl/score/sixdim_by_event"+t+".tsv(.gz) missing (per-event six-dimension table, needed for event-filtered re-ranking)");
            console.log("extra assertions OK: iso="+iso+" zh="+M.countriesZh[iso]+" cont="+M.continentOf[iso]+" held="+st.heldLongest+" yTop10max="+Math.max.apply(null,M.ranked.map(p=>p.yTop10)));
          '
      - name: Page render smoke (DOM stubs)
        run: |
          SMOKE_DATA=./_sample_data.js node etl/smoke_pages.js
