<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六维分数细则 · Cube GOAT</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .sd-redirect{max-width:560px;margin:14vh auto;padding:0 20px;text-align:center}
  .sd-redirect h1{font-size:22px;margin:0 0 10px}
  .sd-redirect p{color:var(--text-2);margin:0 0 18px}
  .sd-redirect a{color:var(--accent)}
  .sd-redirect .sp{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 18px;animation:sdSpin .8s linear infinite}
  @keyframes sdSpin{to{transform:rotate(360deg)}}
</style>
<script>
  /* 六维分数细则已于 2026-11-04 正式上线为「参数设置」页的子页面。
     本独立实验页不再维护（旧版表格有列错位与游离色条两处 bug），
     保留此 URL 仅为兼容旧书签 / 外链，直接跳转到新子页面。 */
  (function () {
    try { location.replace('index.html#/model/sixdim'); } catch (e) { }
  })();
</script>
</head>
<body>
<div class="sd-redirect">
  <div class="sp"></div>
  <h1>六维分数细则</h1>
  <p>该页面已迁移到「参数设置 → 六维分数细则」子页面，正在跳转…</p>

</html>
